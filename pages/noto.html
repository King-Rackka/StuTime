        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;

        @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0; }
        }
        .pulse-anim { animation: pulse-ring 2s ease-out infinite; }

        @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
        }
        /* Memastikan list (bullet/angka) tetap rapi di dalam editor */
            .note-body ul { list-style-type: disc; margin-left: 1.5rem; margin-top: 0.5rem; }
            .note-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-top: 0.5rem; }
            
            /* Class khusus untuk state tombol aktif */
            .active-btn {
                background-color: #FFD15C !important;
                color: #1E1E20 !important;
            }

            /* Custom scrollbar untuk notes list */
            #notes-list::-webkit-scrollbar {
                width: 4px;
            }
            #notes-list::-webkit-scrollbar-track {
                background: transparent;
            }
            #notes-list::-webkit-scrollbar-thumb {
                background-color: #FFD15C;
                border-radius: 999px;
            }
            #notes-list::-webkit-scrollbar-thumb:hover {
                background-color: #e6bc53;
              }
              #tab-dafpus ::-webkit-scrollbar {
                  width: 4px;
              }
              #tab-dafpus ::-webkit-scrollbar-track {
                  background: transparent;
              }
              #tab-dafpus ::-webkit-scrollbar-thumb {
                  background-color: #FFD15C;
                  border-radius: 999px;
              }
              #tab-dafpus ::-webkit-scrollbar-thumb:hover {

              /* Custom tooltip */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: #FFD15C;
    color: #1E1E20;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 99;
}
[data-tooltip]:hover::after { opacity: 1; }

              
              

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    * { scrollbar-width: thin; scrollbar-color: #444 transparent; }

    /* Mobile journal — padding bawah lebih lega */
    @media (max-width: 767px) {

                <button class="w-full py-3 rounded-xl font-bold cursor-pointer text-sm bg-[#FFD15C] border-none text-[#1E1E20] hover:bg-[#e6bc53] transition duration-200 mt-2" onclick="generate()">
                    Generate →
                </button>
            </div>
 
            <!-- Right: result + saved -->
            <div id="dafpus-right" class="w-full flex flex-col gap-4">
                <!-- Result -->
                <div class="bg-[#2a2a2a] border border-white/[0.07] rounded-2xl p-6 flex flex-col gap-4">
                    <div class="font-bebas text-base tracking-wider text-[#FFD15C]">RESULT</div>
                    <div class="bg-[#1a1a1a] border border-white/[0.07] rounded-xl p-4 min-h-[100px] text-sm text-white leading-relaxed whitespace-pre-wrap" id="dafpusResult">Fill in the form and click Generate to see your bibliography entry here.</div>
                    <div class="flex gap-2">
                        <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-[#FFD15C] text-[#1E1E20] hover:bg-[#e6bc53] transition" onclick="copyResult()">📋 Copy</button>
                        <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-transparent border border-[#FFD15C] text-[#FFD15C] hover:bg-[#FFD15C]/10 transition" onclick="saveResult()">💾 Save</button>
                        <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-transparent border border-red-500/50 text-red-400 hover:bg-red-500/10 transition" onclick="clearResult()">🗑 Clear</button>
                    </div>
                </div>
 
                <!-- Saved entries -->
                <div class="bg-[#2a2a2a] border border-white/[0.07] rounded-2xl p-6 flex flex-col gap-3">
                    <div class="font-bebas text-base tracking-wider text-[#FFD15C]">SAVED ENTRIES</div>
                    <div class="saved-scroll flex flex-col gap-2 overflow-y-auto max-h-64 pr-1" id="savedEntries">
                        <div class="text-center text-[#555] py-5 text-sm">No saved entries yet</div>
                    </div>
                    <button class="w-full py-2.5 rounded-xl text-sm font-semibold bg-transparent border border-white/[0.07] text-[#888] hover:text-white hover:border-white/20 transition" onclick="exportAll()">
                        ⬇ Export All as .txt
                    </button>
                </div>
            </div>
        </div>
    </main>
        <div id="motivate-modal" onclick="closeMotivate(event)" class="fixed inset-0 bg-black/75 flex items-center justify-center z-[200] opacity-0 pointer-events-none transition-opacity duration-200" style="backdrop-filter:blur(8px)">
        <div id="motivate-box" class="bg-[#1a1a1a] border border-white/[0.07] rounded-2xl p-10 max-w-[440px] w-[90%] text-center scale-95 transition-transform duration-200">
        <div class="text-5xl mb-4" id="motivate-emoji">💪</div>
        <div class="text-lg leading-relaxed text-[#ddd] font-medium mb-2" id="motivate-quote"></div>
        <div class="text-sm text-[#888] mb-7" id="motivate-author"></div>
        <button onclick="closeMotivate()" class="bg-[#FFD04E] text-[#111111] px-8 py-3 rounded-xl font-bold text-sm">Let's Go! 🚀</button>

        <script>

function getUser() {
      const u = localStorage.getItem('stutime_user');
      return u ? JSON.parse(u) : { name: 'Student'};
    }
    const NAMA = getUser().name.split(' ')[0];

    function toggleAvatarMenu() {
  const menu = document.getElementById('avatar-menu');
  menu.classList.toggle('hidden');
}

function initAvatar() {
      const initial = NAMA.charAt(0).toUpperCase();
      const btn = document.getElementById('avatar-btn');
      const mobileAvatar = document.getElementById('mobile-avatar');
      const nameLabel = document.getElementById('avatar-name-label');
      const mobileName = document.getElementById('mobile-name-label');
      const menuInitial = document.getElementById('avatar-menu-initial');
      if (menuInitial) menuInitial.textContent = initial;
      if (btn) btn.textContent = initial;
      if (mobileAvatar) mobileAvatar.textContent = initial;
      if (nameLabel) nameLabel.textContent = getUser().name;
      if (mobileName) mobileName.textContent = getUser().name;
    }

document.addEventListener('click', e => {
  const wrapper = document.getElementById('avatar-wrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('avatar-menu').classList.add('hidden');
  }
});

function logOut() {
  window.location.href = '../index.html';
}

  window.addEventListener('load', () => {
    const openId = new URLSearchParams(window.location.search).get('id');
    if (!openId) return;

    const notes = JSON.parse(localStorage.getItem('stutime_notes') || '[]');
    const note = notes.find(n => String(n.id) === String(openId));
    if (!note) return;

    const titleEl = document.querySelector('.note-title');
    const bodyEl = document.querySelector('.note-body');
    if (titleEl) titleEl.value = note.title || '';
    if (bodyEl) bodyEl.innerHTML = note.body || '';

    const favIcon = document.getElementById('fav-icon');
    if (favIcon) {
      favIcon.className = note.isFavorite
        ? 'fa-solid fa-star'
        : 'fa-regular fa-star';
    }

    if (typeof selectNote === 'function') {
      selectNote(note.id);
    } else {
      const items = document.querySelectorAll('#notes-list [data-id]');
      items.forEach(item => {
        if (String(item.dataset.id) === String(openId)) item.click();
      });
    }
  });

initAvatar();

</script>

    </body>
